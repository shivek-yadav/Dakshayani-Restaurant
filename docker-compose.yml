# Optional: local MongoDB for developers who have Docker Desktop installed.
services:
  mongodb:
    image: mongo:7
    container_name: dakshayani-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - dakshayani_mongo_data:/data/db
volumes:
  dakshayani_mongo_data:
